name: build
on:
  schedule:
    - cron: "0 1 * * *" # 每日北京时间 09:00
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["config/**", "src/**", "tests/**", "scripts/**", "main.py", ".github/workflows/**"]
  pull_request:
    paths: ["config/**", "src/**", "tests/**", "scripts/**", "main.py", ".github/workflows/**"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: unit and publish integration tests
        run: python -m unittest discover -s tests -q
      - name: offline build
        run: python main.py build --offline

  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: adkit-dist-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: restore last successful state
        run: python scripts/publish.py restore
      - name: build with quality gates
        run: python main.py build
      - name: publish latest and preserve stable
        run: python scripts/publish.py publish
