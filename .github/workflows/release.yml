name: promote-stable
# 每周二 09:00（北京）把 dist 分支当前（= 最近一次全绿）构建钉成 stable：
# 1) dist 分支内 latest/ 复制到 stable/ —— 朋友端 update-url 到这一刻才拿到新规则
# 2) GitHub Release 存档，便于手动回滚
on:
  schedule:
    - cron: "0 1 * * 2" # UTC 周二 01:00 = 北京周二 09:00
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dist
      - name: promote latest -> stable
        run: |
          set -e
          git config user.name "adkit-bot"
          git config user.email "adkit-bot@users.noreply.github.com"
          mkdir -p stable
          cp latest/adkit.conf stable/adkit.conf
          git add -A
          git diff --cached --quiet || git commit -m "promote stable $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push origin dist
      - name: release snapshot
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="stable-$(date +%Y%m%d)"
          gh release create "$TAG" stable/adkit.conf adkit-adonly.conf stats.json \
            --title "$TAG（每周二钉版）" \
            --notes "本轮 stable 快照。回滚方法：把设备 SR 里的订阅链接临时切到上一个 Release 的 adkit.conf。" || true
