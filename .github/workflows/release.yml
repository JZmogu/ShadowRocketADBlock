name: promote-stable
on:
  schedule:
    - cron: "0 1 * * 2" # 每周二北京时间 09:00
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promote:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: adkit-dist-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: promote pending to stable
        id: promotion
        run: python scripts/publish.py promote
      - name: release snapshot
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ steps.promotion.outputs.sha }}
        run: |
          set -euo pipefail
          TAG="stable-${RELEASE_SHA}"
          ASSETS=(dist/release/stable/adkit.conf dist/release/stable/adkit.module dist/release/stable/adkit-lite.module dist/release/adkit-adonly.conf dist/release/stats.json)
          # 同一提交的重跑先恢复已有 Release；查询失败会由 create 明确报错。
          if gh release view "$TAG" --json tagName >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
          else
            gh release create "$TAG" "${ASSETS[@]}" \
              --target "$RELEASE_SHA" \
              --title "$TAG" \
              --notes "stable 配置与模块快照。附件保留 stable 通道更新地址，可下载后在设备上手动导入回滚。"
          fi
