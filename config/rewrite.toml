# MITM 只登记 hostname：产物永远不含 ca-p12/ca-passphrase（CI 断言强制），
# 设备上请用自己的证书（Shadowrocket“HTTPS 解密”页生成）。
[mitm]
hosts = [
  # 初始条目
  "*.alicdn.com", "*.taou.com", "*.58.com", "cloud.video.taobao.com",
  "m5.amap.com", "api.m.jd.com", "*.360buyimg.com", "www.tianxibook.com",
  "interface.music.163.com", "interface3.music.163.com", "app.bilibili.com", "api.zhihu.com",
  "acs.m.goofish.com",
  # App 接口
  "acs.m.taobao.com", "guide-acs.m.taobao.com",
  "*.meituan.net", "www.meituan.com", "wmapi.meituan.com", "peisongapi.meituan.com",
  "*.xiaohongshu.com",
  "*.weibo.cn", "*.weibo.com",
  "*.elemecdn.com", "elemecdn.com",
  "c.y.qq.com", "*.y.qq.com",
  "r.inews.qq.com", "mp.weixin.qq.com",
  "client.mail.163.com", "appconf.mail.163.com",
  "manga.bilibili.com",
  "beacon.qq.com", "otheve.beacon.qq.com",
]
