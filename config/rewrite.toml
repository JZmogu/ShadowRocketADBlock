# 人工精选的开屏/内嵌广告 URL 改写登记表（v0.1）——不自动跟随上游，手工钉版。
# 语法为 Shadowrocket 原生： <正则> <目标> <动作>；目标 "_" 表示不改 URL 直接处置响应。
# 首批 18 条：全文照抄 huijingfei/Shadowrocket-Rules sr_app_ad.conf [URL Rewrite]（asof 2026-10-29）
# 以后加 deezertidal startingad / AdBlock 分桶合并时，逐条登记 src 与 asof。

