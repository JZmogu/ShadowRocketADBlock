[[rewrite]]
site = "网易云音乐 开屏/信息流广告扩展"
pattern = '^https?://interface(?:3)?\.music\.163\.com/e?api/(?:ad/(?:loading/(?:get|current)|get)|link/(?:position|scene)/show/resource)(?:\?|$)'
target = "_"
action = "REJECT-DICT"
src = "akiralereal@2026-10-29"
example_urls = ["https://interface.music.163.com/eapi/ad/loading/get", "https://interface3.music.163.com/eapi/ad/loading/get", "https://interface.music.163.com/api/ad/loading/current", "https://interface3.music.163.com/eapi/ad/get", "https://interface.music.163.com/eapi/link/position/show/resource", "https://interface3.music.163.com/api/link/scene/show/resource"]
