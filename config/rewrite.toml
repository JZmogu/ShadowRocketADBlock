pattern = '^https?://r\.inews\.qq\.com/(adsBlacklist|getFullScreenPic|getQQNewsRemoteConfig)'
target = "_"
action = "REJECT-DICT"
src = "deezertidal-startingad@2026-10-30"
note = "保留已登记的新闻流接口；不代表覆盖 QQ 全部信息流广告。"
example_urls = ["https://r.inews.qq.com/adsBlacklist", "https://r.inews.qq.com/getFullScreenPic", "https://r.inews.qq.com/getQQNewsRemoteConfig"]
allow_urls = ["https://r.inews.qq.com/getNewsDetail"]

[[rewrite]]
site = "QQ 内嵌新闻流 广告拉取/上报"
pattern = '^https?://r\.inews\.qq\.com/(getBannerAds|getNewsRemoteConfig|getSplash|searchHotCatList|upLoadLoc)'
target = "_"
action = "REJECT-DICT"
src = "deezertidal-startingad@2026-10-30"
example_urls = ["https://r.inews.qq.com/getBannerAds", "https://r.inews.qq.com/getNewsRemoteConfig", "https://r.inews.qq.com/getSplash", "https://r.inews.qq.com/searchHotCatList", "https://r.inews.qq.com/upLoadLoc"]
allow_urls = ["https://r.inews.qq.com/getNewsDetail"]

[[rewrite]]
site = "微信 小店/商品推荐位"
pattern = '^https?://mp\.weixin\.qq\.com/mp/cps_product_info'
target = "_"
action = "REJECT"
src = "deezertidal-startingad@2026-10-30"
note = "只覆盖登记的商品卡片接口；部分客户端可能拒绝 HTTPS 解密，不保证在所有微信版本生效。"
example_urls = ["https://mp.weixin.qq.com/mp/cps_product_info?scene=sample"]
allow_urls = ["https://mp.weixin.qq.com/s?article=sample"]

[[rewrite]]
site = "QQ 系埋点上报"
pattern = '^https://otheve\.beacon\.qq\.com/analytics/upload\?sid=.*'
target = "_"
action = "REJECT-DICT"
src = "deezertidal-startingad@2026-10-29"
example_urls = ["https://otheve.beacon.qq.com/analytics/upload?sid=example"]
allow_urls = ["https://otheve.beacon.qq.com/health"]

# —— 网易系（邮箱大师内嵌广告；网易云开屏/横幅扩展）——
[[rewrite]]
site = "网易邮箱大师 广告配置拉取"
