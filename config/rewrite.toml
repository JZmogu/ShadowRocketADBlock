# 人工精选的开屏/内嵌广告 URL 改写登记表（v0.1）——不自动跟随上游，手工钉版。
# 语法为 Shadowrocket 原生： <正则> <目标> <动作>；目标 "_" 表示不改 URL 直接处置响应。
# 初始条目参考 huijingfei/Shadowrocket-Rules sr_app_ad.conf [URL Rewrite]（2026-10-29）。
# 修改后保留 src 出处；example_urls / allow_urls 是合成回归样例，不代表真机验证。
# allow_urls 只断言不命中所属条目，不等同于全局白名单。

[[rewrite]]
site = "google.cn 跳转"
pattern = '^https?:\/\/(www\.)?(g\.cn|google\.cn)\/?$'
target = "https://www.google.com"
action = "307"
src = "huijingfei@2026-10-29"
enabled = false
note = "停用，保留历史条目；不作为广告拦截功能。"
example_urls = ["https://g.cn/", "https://www.g.cn/", "https://google.cn/", "https://www.google.cn/"]
allow_urls = ["https://www.google.cn/search?q=test"]

