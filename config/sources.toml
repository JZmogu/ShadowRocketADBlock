# 下载登记表：enabled=false 停用；min_rules 和 max_deviation 控制单源健康检查。
[meta]
repo = "JZmogu/ShadowRocketADBlock"
# dist 分支上的两个通道：stable 给朋友（周二钉版），latest 给我自己（日更尝鲜）
stable_url = "https://raw.githubusercontent.com/JZmogu/ShadowRocketADBlock/dist/stable/adkit.conf"
latest_url = "https://raw.githubusercontent.com/JZmogu/ShadowRocketADBlock/dist/latest/adkit.conf"

[[sources]]
id = "johnshall"
name = "Johnshall/Shadowrocket-ADBlock-Rules-Forever（仅取 ad_only 段）"
url = "https://raw.githubusercontent.com/Johnshall/Shadowrocket-ADBlock-Rules-Forever/release/sr_ad_only.conf"
parser = "sr_conf_rule"
license = "CC-BY-SA-4.0"
enabled = true
min_rules = 10000
max_deviation = 0.4

[[sources]]
id = "antiad"
name = "privacy-protection-tools/anti-AD（Surge 规则）"
url = "https://raw.githubusercontent.com/privacy-protection-tools/anti-AD/master/anti-ad-surge.txt"
fallback_urls = ["https://cdn.jsdelivr.net/gh/privacy-protection-tools/anti-AD@master/anti-ad-surge.txt"]
parser = "surge_list"
license = "MIT"
enabled = true
min_rules = 20000
max_deviation = 0.4

[[sources]]
id = "awavenue"
name = "TG-Twilight/AWAvenue-Ads-Rule（秋风，仅 Surge-RULE-SET 全量档）"
url = "https://raw.githubusercontent.com/TG-Twilight/AWAvenue-Ads-Rule/main/Filters/AWAvenue-Ads-Rule-Surge-RULE-SET.list"
parser = "surge_list"
license = "GPL-3.0"
enabled = true
min_rules = 300
max_deviation = 0.4

[[sources]]
id = "huijingfei"
name = "huijingfei/Shadowrocket-Rules（仅 [Rule] 段；开屏改写见 rewrite.toml）"
url = "https://raw.githubusercontent.com/huijingfei/Shadowrocket-Rules/main/sr_app_ad.conf"
parser = "sr_conf_rule"
license = "无许可证（已按出处收录，作者异议即剔除）"
enabled = true
min_rules = 300
max_deviation = 0.4
